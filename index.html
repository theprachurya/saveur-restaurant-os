<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saveur — Kitchen Operations & Restaurant Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&family=Playfair+Display:ital,wght@0,500..800;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --cream: #FDF9F3;
  --cream-dark: #F5EFEB;
  --ink: #17110B;
  --rust: #BD4522;
  --rust-light: #FBEBE6;
  --rust-dark: #912E12;
  --gold: #C9972E;
  --gold-light: #FBF4E4;
  --sage: #3F5E37;
  --sage-light: #EBF2EA;
  --muted: #796C5F;
  --border: #E8DFD4;
  --card-bg: #FFFFFF;
  --red: #D9383A;
  --red-light: #FDF0F0;
  --shadow-sm: 0 2px 8px rgba(23, 17, 11, 0.04);
  --shadow-md: 0 8px 24px rgba(23, 17, 11, 0.08);
  --shadow-lg: 0 16px 40px rgba(23, 17, 11, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background-color: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .font-serif {
  font-family: 'Playfair Display', serif;
}

.font-mono {
  font-family: 'JetBrains Mono', monospace;
}

/* App Shell Layout */
#app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background-color: var(--ink);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  padding: 1.5rem 0;
}

.brand {
  padding: 0 1.5rem 1.25rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand h2 {
  color: #fff;
  font-size: 22px;
  letter-spacing: -0.5px;
}
.brand span {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  display: block;
  margin-top: 2px;
}

/* Portal Role Switcher */
.portal-switcher {
  display: flex;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 3px;
  margin: 1.25rem 1.25rem 0.5rem;
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.portal-btn {
  flex: 1;
  padding: 8px 10px;
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.65);
  font-size: 12px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
}
.portal-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.04);
}
.portal-btn.active {
  background: var(--rust);
  color: #fff;
  box-shadow: 0 2px 8px rgba(189, 69, 34, 0.35);
}

.nav-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: rgba(255, 255, 255, 0.35);
  padding: 1rem 1.5rem 0.4rem;
  font-weight: 700;
}

.nav-links {
  list-style: none;
  flex: 1;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 1.5rem;
  color: rgba(255, 255, 255, 0.65);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  border-left: 3px solid transparent;
}
.nav-item:hover {
  color: #fff;
  background-color: rgba(255, 255, 255, 0.05);
}
.nav-item.active {
  color: #fff;
  background-color: rgba(255, 255, 255, 0.08);
  border-left-color: var(--gold);
}
.nav-item .icon {
  font-size: 16px;
  width: 20px;
  text-align: center;
}

.sidebar-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 11px;
  color: rgba(255, 255, 255, 0.4);
}

/* Main Content Area */
.main-wrapper {
  margin-left: 260px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  height: 64px;
  background: rgba(253, 249, 243, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.5rem;
  position: sticky;
  top: 0;
  z-index: 30;
}

.content-pane {
  padding: 2rem 2.5rem;
  flex: 1;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: 9px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  font-family: inherit;
}
.btn-primary {
  background-color: var(--rust);
  color: #fff;
}
.btn-primary:hover:not(:disabled) {
  background-color: var(--rust-dark);
}
.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--ink);
}
.btn-outline:hover:not(:disabled) {
  border-color: var(--muted);
  background-color: #fff;
}
.btn-gold {
  background-color: var(--gold);
  color: #fff;
}
.btn-gold:hover:not(:disabled) {
  background-color: #b0811f;
}
.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 7px;
}
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* Cards & Badges */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
}
.badge-green { background: var(--sage-light); color: var(--sage); }
.badge-amber { background: var(--gold-light); color: #8A6412; }
.badge-red { background: var(--red-light); color: var(--red); }
.badge-muted { background: var(--cream-dark); color: var(--muted); }

/* Menu Grid */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.menu-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
}
.menu-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.menu-card-header {
  height: 120px;
  background: linear-gradient(135deg, var(--rust-light), var(--gold-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}
.menu-card-body {
  padding: 1.25rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Out of Stock Greying Out */
.menu-card.sold-out {
  opacity: 0.52;
  filter: grayscale(1);
  background: #F7F3EE;
  border-color: #DDD4C8;
}
.menu-card.sold-out .menu-card-header {
  background: #EAE3D9;
}
.menu-card.sold-out button {
  cursor: not-allowed;
  background: #E2DAD0;
  color: #796C5F;
  border-color: #D3C9BC;
}

/* Category Filter Tabs */
.cat-filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 1rem;
}
.cat-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s ease;
}
.cat-pill:hover {
  border-color: var(--rust);
  color: var(--ink);
}
.cat-pill.active {
  background: var(--rust);
  color: #fff;
  border-color: var(--rust);
}

/* Dashboard Metric Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}
.stat-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem 1.5rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}
.stat-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 8px;
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  letter-spacing: -0.5px;
}
.stat-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

/* Kitchen Kanban */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.25rem;
  margin-top: 1.5rem;
}
.kanban-col {
  background: rgba(232, 223, 212, 0.45);
  border-radius: 14px;
  padding: 1rem;
  min-height: 480px;
}
.kanban-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(23, 17, 11, 0.55);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 1rem;
}
.modal-box {
  background: #fff;
  border-radius: 18px;
  max-width: 540px;
  width: 100%;
  padding: 2rem;
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
}

/* Tables */
.table-custom {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.table-custom th {
  text-align: left;
  padding: 10px 14px;
  color: var(--muted);
  font-weight: 600;
  border-bottom: 1.5px solid var(--border);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
}
.table-custom td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.table-custom tr:last-child td {
  border-bottom: none;
}

/* Toast */
#toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 110;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13.5px;
  box-shadow: var(--shadow-md);
  animation: toastIn 0.25s ease;
}
@keyframes toastIn {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Responsive Media Queries */
@media (max-width: 860px) {
  .sidebar {
    width: 72px;
    padding: 1rem 0;
  }
  .brand h2, .brand span, .nav-item span:not(.icon), .sidebar-footer, .nav-section-title, .portal-btn span:not(.p-icon) {
    display: none;
  }
  .brand {
    padding: 0 0.5rem 1rem;
    text-align: center;
  }
  .portal-switcher {
    flex-direction: column;
    margin: 0.5rem;
  }
  .nav-item {
    padding: 12px;
    justify-content: center;
  }
  .nav-item .icon {
    font-size: 20px;
    margin: 0;
  }
  .main-wrapper {
    margin-left: 72px;
  }
  .topbar, .content-pane {
    padding: 1rem 1.25rem;
  }
  .kanban-board {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-container"></div>

<script type="module">
import { InventoryEngine } from './src/engine/inventory-engine.mjs';

// Application State Keys
const STORAGE_KEY = 'saveur_kitchenops_state';
const ROLE_KEY = 'saveur_active_role';
const VIEW_KEY = 'saveur_active_view';
const CART_KEY = 'saveur_cart_state';
const CUSTOMER_ORDERS_KEY = 'saveur_customer_orders';

// Initialize Engine
const engine = new InventoryEngine();

// Load persistent local storage state
const savedState = localStorage.getItem(STORAGE_KEY);
if (savedState) {
  try {
    const parsed = JSON.parse(savedState);
    if (parsed.ingredients) engine.ingredients = new Map(parsed.ingredients.map(i => [i.id, i]));
    if (parsed.orders) engine.orders = parsed.orders;
    if (parsed.movements) engine.movements = parsed.movements;
    if (parsed.wasteLogs) engine.wasteLogs = parsed.wasteLogs;
    if (parsed.menu) engine.menu = parsed.menu;
  } catch (err) {
    console.warn('Failed to load local storage state:', err);
  }
}

// Restore saved cart
let initialCart = [];
const savedCart = localStorage.getItem(CART_KEY);
if (savedCart) {
  try { initialCart = JSON.parse(savedCart); } catch (e) {}
}

// Restore customer placed order IDs
let initialCustomerOrders = [];
const savedCustOrders = localStorage.getItem(CUSTOMER_ORDERS_KEY);
if (savedCustOrders) {
  try { initialCustomerOrders = JSON.parse(savedCustOrders); } catch (e) {}
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    ingredients: engine.getIngredients(),
    orders: engine.orders,
    movements: engine.movements,
    wasteLogs: engine.wasteLogs,
    menu: engine.menu,
  }));
  localStorage.setItem(CART_KEY, JSON.stringify(S.cart));
  localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(S.customerOrders));
}

// Global UI State
const S = {
  role: 'customer', // 'customer' or 'owner'
  view: 'customer-menu', // customer-menu, customer-orders, owner-dashboard, owner-kds, owner-menu, owner-inventory, owner-ledger, owner-qa
  cart: initialCart,
  customerOrders: initialCustomerOrders,
  selectedCategory: 'all',
  activeModal: null, // 'cart', 'order-success', 'delivery', 'waste', 'recipe', 'edit-dish', 'add-dish'
  selectedDishId: null,
  latestOrder: null,
  qaLog: [],
  qaRunning: false,
};

// Route and Hash synchronization
function syncRouteFromHash() {
  const hash = window.location.hash.replace(/^#\/?/, '').trim();
  if (hash) {
    const parts = hash.split('/');
    const rolePart = parts[0];
    const viewPart = parts[1];

    if (rolePart === 'customer' || rolePart === 'owner') {
      S.role = rolePart;
    }
    if (viewPart) {
      S.view = viewPart;
    }
  } else {
    // Fall back to saved localStorage preferences
    const savedRole = localStorage.getItem(ROLE_KEY);
    const savedView = localStorage.getItem(VIEW_KEY);
    if (savedRole === 'customer' || savedRole === 'owner') {
      S.role = savedRole;
    }
    if (savedView) {
      S.view = savedView;
    }
  }

  // Validate that current view matches active role
  if (S.role === 'customer') {
    if (!['customer-menu', 'customer-orders'].includes(S.view)) {
      S.view = 'customer-menu';
    }
  } else {
    if (!['owner-dashboard', 'owner-kds', 'owner-menu', 'owner-inventory', 'owner-ledger', 'owner-qa'].includes(S.view)) {
      S.view = 'owner-dashboard';
    }
  }

  // Keep hash and storage updated
  localStorage.setItem(ROLE_KEY, S.role);
  localStorage.setItem(VIEW_KEY, S.view);
  if (window.location.hash !== `#${S.role}/${S.view}`) {
    window.location.hash = `${S.role}/${S.view}`;
  }
}

// Run initial route sync
syncRouteFromHash();
window.addEventListener('hashchange', () => {
  syncRouteFromHash();
  render();
});

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
window.toast = toast;

// ─── Actions & Navigation ──────────────────────────────────────

window.switchRole = function(newRole) {
  if (S.role === newRole) return;
  S.role = newRole;
  if (newRole === 'customer') {
    S.view = 'customer-menu';
  } else {
    S.view = 'owner-dashboard';
  }
  localStorage.setItem(ROLE_KEY, S.role);
  localStorage.setItem(VIEW_KEY, S.view);
  window.location.hash = `${S.role}/${S.view}`;
  render();
};

window.navigate = function(view) {
  S.view = view;
  localStorage.setItem(VIEW_KEY, view);
  window.location.hash = `${S.role}/${S.view}`;
  render();
};

window.setCategory = function(cat) {
  S.selectedCategory = cat;
  render();
};

window.addToCart = function(dishId) {
  const dish = engine.getMenuItem(dishId);
  if (!dish || dish.isAvailable === false) {
    toast('This item is currently unavailable.');
    return;
  }

  const maxAvail = engine.calculateAvailablePortions(dishId);
  const existing = S.cart.find(c => c.id === dishId);
  const currentQty = existing ? existing.qty : 0;

  if (currentQty + 1 > maxAvail) {
    toast(`Cannot add more: Only ${maxAvail} portions available from kitchen stock.`);
    return;
  }

  if (existing) {
    existing.qty++;
  } else {
    S.cart.push({ id: dishId, qty: 1 });
  }
  persist();
  toast(`Added ${dish.name} to order`);
  render();
};

window.updateCartQty = function(dishId, delta) {
  const idx = S.cart.findIndex(c => c.id === dishId);
  if (idx === -1) return;

  const dish = engine.getMenuItem(dishId);
  const maxAvail = engine.calculateAvailablePortions(dishId);
  const nextQty = S.cart[idx].qty + delta;

  if (nextQty > maxAvail) {
    toast(`Kitchen only has stock for ${maxAvail} portions`);
    return;
  }

  if (nextQty <= 0) {
    S.cart.splice(idx, 1);
  } else {
    S.cart[idx].qty = nextQty;
  }
  persist();
  render();
};

window.openModal = function(modalName, dishId = null) {
  S.activeModal = modalName;
  S.selectedDishId = dishId;
  render();
};

window.closeModal = function() {
  S.activeModal = null;
  render();
};

window.submitOrder = function() {
  if (S.cart.length === 0) return;

  try {
    const tableNum = Math.floor(1 + Math.random() * 12);
    const result = engine.processOrder({
      customerId: 'cust_' + Math.floor(100 + Math.random() * 900),
      customerName: `Dine-In Table ${tableNum}`,
      items: S.cart,
    });

    // Save order ID to customer tracking list
    S.customerOrders.unshift(result.order.id);
    S.latestOrder = result.order;
    S.cart = [];
    persist();

    S.activeModal = 'order-success';
    toast('Order confirmed! Sent to Kitchen Display System.');
    render();
  } catch (err) {
    alert(`Order Rejected: ${err.message}`);
  }
};

window.advanceOrderStatus = function(orderId, nextStatus) {
  engine.updateOrderStatus(orderId, nextStatus);
  persist();
  toast(`Order #${orderId.slice(-6)} moved to ${nextStatus}`);
  render();
};

window.cancelOrder = function(orderId) {
  if (!confirm(`Cancel Order #${orderId.slice(-6)} and return reserved ingredients to kitchen stock?`)) return;
  try {
    engine.updateOrderStatus(orderId, 'Cancelled');
    persist();
    toast(`Order #${orderId.slice(-6)} cancelled. Ingredients restored!`);
    render();
  } catch (err) {
    alert(err.message);
  }
};

window.submitDelivery = function(e) {
  e.preventDefault();
  const ingId = document.getElementById('del-ing-id').value;
  const qty = parseFloat(document.getElementById('del-qty').value);
  const supplier = document.getElementById('del-supplier').value.trim() || 'Local Market';

  if (isNaN(qty) || qty <= 0) {
    alert("Please enter a valid positive delivery quantity.");
    return;
  }

  try {
    engine.recordDelivery({ ingredientId: ingId, quantity: qty, supplier });
    persist();
    closeModal();
    toast(`Stock increased by +${qty}`);
  } catch (err) {
    alert(err.message);
  }
};

window.submitWaste = function(e) {
  e.preventDefault();
  const ingId = document.getElementById('wst-ing-id').value;
  const qty = parseFloat(document.getElementById('wst-qty').value);
  const reason = document.getElementById('wst-reason').value;

  if (isNaN(qty) || qty <= 0) {
    alert("Please enter a valid positive waste quantity.");
    return;
  }

  try {
    engine.recordWaste({ ingredientId: ingId, quantity: qty, reason });
    persist();
    closeModal();
    toast(`Waste recorded: -${qty}`);
  } catch (err) {
    alert(err.message);
  }
};

// Owner Menu Updating Actions
window.submitEditDish = function(e) {
  e.preventDefault();
  const id = S.selectedDishId;
  const name = document.getElementById('edit-dish-name').value;
  const price = parseFloat(document.getElementById('edit-dish-price').value);
  const cat = document.getElementById('edit-dish-cat').value;
  const emoji = document.getElementById('edit-dish-emoji').value;
  const desc = document.getElementById('edit-dish-desc').value;
  const isAvailable = document.getElementById('edit-dish-avail').checked;

  try {
    engine.updateMenuItem(id, { name, price, cat, emoji, desc, isAvailable });
    persist();
    closeModal();
    toast(`Menu item "${name}" updated successfully!`);
    render();
  } catch (err) {

// Automated Acceptance & Concurrency Tester
window.runConcurrencyTest = async function() {
  S.qaRunning = true;
  S.qaLog = [];
  render();

  const appendLog = (msg) => {
    S.qaLog.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
    render();
  };

  appendLog('▶ Starting Concurrency & Overselling Prevention Test...');
  await new Promise(r => setTimeout(r, 350));

  const pot = engine.getIngredient('ing_potatoes');
  if (pot && pot.stock < 10) pot.stock = 25.0;
  const butter = engine.getIngredient('ing_butter');
  if (butter && butter.stock < 2) butter.stock = 5.0;

  const steak = engine.getIngredient('ing_steak');
  const delta = 3 - steak.stock;
  if (delta > 0) {
    engine.receiveInventory({ ingredientId: 'ing_steak', quantity: delta, batchNumber: 'QA-CALIB', supplier: 'Acceptance Suite' });
  } else if (delta < 0) {
    engine.recordWaste({ ingredientId: 'ing_steak', quantity: Math.abs(delta), reason: 'QA calibration' });
  }
  appendLog(`🧪 Calibrated Ribeye Steak inventory to exactly 3 pieces via ledger.`);

  appendLog('⚡ Simulating 6 rapid concurrent orders for Steak Frites (1 portion each)...');
  await new Promise(r => setTimeout(r, 500));

  let successful = 0;
  let blocked = 0;

  for (let i = 1; i <= 6; i++) {
    try {
      engine.processOrder({
        customerId: `client_${i}`,
        customerName: `Customer #${i}`,
        items: [{ id: 'dish_5', qty: 1 }],
      });
      successful++;
      appendLog(`  ✓ Order ${i}: Accepted (Inventory remaining: ${steak.stock})`);
    } catch (err) {
      blocked++;
      appendLog(`  ✗ Order ${i}: BLOCKED by Atomic Engine (${err.message})`);
    }
  }

  await new Promise(r => setTimeout(r, 350));
  appendLog(`📊 Test Result: ${successful} Accepted, ${blocked} Blocked.`);
  
  if (successful === 3 && blocked === 3 && steak.stock === 0) {
    appendLog('🎉 PASS: Zero overselling occurred. Concurrency protection verified!');
  } else {
    appendLog('❌ FAIL: Inconsistent stock condition detected.');
  }

  const audit = engine.auditLedgerIntegrity();
  appendLog(`📜 Ledger Audit Status: ${audit.isValid ? 'VERIFIED MATCH (100% Consistent)' : 'DISCREPANCY FOUND'}`);

  persist();
  S.qaRunning = false;
  render();
};

function renderOwnerDashboard() {

  const netSales = validOrders.reduce((sum, o) => sum + o.subtotal, 0);
  const totalTax = validOrders.reduce((sum, o) => sum + o.tax, 0);

  // Cost of goods sold (COGS) from ingredient consumption movements
  const cogs = engine.movements
    .filter(m => m.movementType === 'order_consumption')
    .reduce((sum, m) => {
      const ing = engine.getIngredient(m.ingredientId);
      const unitCost = ing ? ing.cost : 0;
      return sum + (Math.abs(m.delta) * unitCost);

        <div class="modal-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
            <h2 style="font-size:20px">${dish ? dish.emoji : ''} ${dish ? dish.name : ''} Recipe Specifications</h2>
            <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:1rem">
            Internal ingredient requirements per portion and current warehouse stock availability.
          </p>
          <table class="table-custom" style="margin-bottom:1.5rem">
            <thead>
              <tr><th>Ingredient</th><th>Required / Portion</th><th>In Stock</th></tr>
            </thead>
            <tbody>
              ${recipe.map(r => `
                <tr>
                  <td><strong>${r.ingredientName}</strong></td>
                  <td class="font-mono">${r.quantity} ${r.unit}</td>
                  <td class="font-mono text-muted">${r.stockAvailable.toFixed(2)} ${r.unit}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <button class="btn btn-outline" style="width:100%" onclick="closeModal()">Close</button>
        </div>
      </div>
    `;
  }

  if (S.activeModal === 'delivery') {
    const ingredients = engine.getIngredients();
    return `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
            <h2 style="font-size:20px">Log Supplier Delivery</h2>
            <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
          </div>
          <form onsubmit="submitDelivery(event)" style="display:flex;flex-direction:column;gap:14px">
            <div>
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Ingredient</label>
              <select id="del-ing-id" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)">
                ${ingredients.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Quantity Received</label>
              <input id="del-qty" type="number" step="0.01" min="0.01" required style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)" placeholder="e.g. 5.0">
            </div>
            <div>
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Supplier Name</label>
              <input id="del-supplier" type="text" value="Marché Central" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:10px">Record Delivery</button>
          </form>
        </div>
      </div>
    `;
  }

  if (S.activeModal === 'waste') {
    const ingredients = engine.getIngredients();
    return `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
            <h2 style="font-size:20px">Record Kitchen Waste & Spoilage</h2>
            <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
          </div>
          <form onsubmit="submitWaste(event)" style="display:flex;flex-direction:column;gap:14px">
            <div>
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Ingredient</label>
              <select id="wst-ing-id" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)">
                ${ingredients.map(i => `<option value="${i.id}">${i.name} (Current: ${i.stock} ${i.unit})</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Quantity Wasted</label>
              <input id="wst-qty" type="number" step="0.01" min="0.01" required style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)" placeholder="e.g. 0.5">
            </div>
            <div>
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">Reason</label>
              <select id="wst-reason" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border)">
                <option value="Spoilage">Spoilage / Expired</option>
                <option value="Prep Loss">Prep Trimming Loss</option>
                <option value="Spill/Drop">Accidental Drop</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:10px">Log Waste Entry</button>
          </form>
        </div>
      </div>
    `;
  }

  return '';
}

// Initial render
render();
</script>
</body>
</html>
